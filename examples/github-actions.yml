name: Test migration helpers
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 skills/arc-to-zen/assets/zen-link-preview/build.py --output "$RUNNER_TEMP/preview-build"
